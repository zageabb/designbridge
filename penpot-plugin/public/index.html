<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DesignBridge Importer</title>
  <style>
    body{font:13px system-ui,sans-serif;margin:0;padding:16px;background:#15191d;color:#f4f5f6}
    h1{font-size:16px;margin:0 0 6px}.muted{color:#aab2ba;margin-bottom:14px}
    textarea{width:100%;height:255px;box-sizing:border-box;background:#20262b;color:#f4f5f6;border:1px solid #3a444d;border-radius:7px;padding:10px;font:11px ui-monospace,monospace}
    input[type=text]{width:100%;box-sizing:border-box;background:#20262b;color:#f4f5f6;border:1px solid #3a444d;border-radius:6px;padding:8px}
    .syncbox{border:1px solid #343d45;border-radius:8px;padding:10px;margin:10px 0;background:#1b2024}
    .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}button,label.file{background:#2f88ff;color:white;border:0;border-radius:6px;padding:9px 12px;cursor:pointer}
    label.file{background:#343d45}input[type=file]{display:none}#status{margin-top:10px;min-height:18px;color:#b8c4cf}
  </style>
</head>
<body>
  <h1>DesignBridge Importer</h1>
  <div class="muted">Direct-sync a saved DesignBridge project, or use JSON import as a fallback.</div>
  <div class="syncbox">
    <strong>Direct sync</strong>
    <div class="muted" style="margin:5px 0 4px">Project: <span id="projectId">not linked</span></div>
    <div class="muted" style="margin:0 0 8px">Revision: <span id="revisionState">unknown</span> <span id="updateBadge" style="display:none;margin-left:6px;padding:2px 6px;border-radius:10px;background:#9b6b00;color:#fff">update available</span></div>
    <input id="apiUrl" type="text" value="http://127.0.0.1:5087" aria-label="DesignBridge API URL">
    <div class="row">
      <button id="connect">Test connection</button>
      <button id="reviewLatest">Review latest</button>
      <button id="checkConflicts">Check local conflicts</button>
      <button id="reviewDocument">Review whole document</button>
      <button id="reviewComponents">Review components</button>
      <button id="reviewDefinitions">Review definitions</button>
      <button id="reviewVariants">Review variants</button>
      <button id="pullLatest">Pull latest</button>
      <button id="pushSelection">Push selection</button>
    </div>
    <div id="syncStatus" class="muted" style="margin:8px 0 0">Not connected.</div>
    <div id="latestSummary" class="muted" style="margin:6px 0 0;display:none"></div>
    <div id="diffSummary" style="margin-top:8px;display:none;border-top:1px solid #343d45;padding-top:8px"></div>
    <div id="selectivePull" style="margin-top:8px;display:none"></div>
    <div id="conflictSummary" style="margin-top:8px;display:none;border-top:1px solid #343d45;padding-top:8px"></div>
    <div id="documentSummary" style="margin-top:8px;display:none;border-top:1px solid #343d45;padding-top:8px"></div>
    <div id="componentSummary" style="margin-top:8px;display:none;border-top:1px solid #343d45;padding-top:8px"></div>
    <div id="definitionSummary" style="margin-top:8px;display:none;border-top:1px solid #343d45;padding-top:8px"></div>
    <div id="variantSummary" style="margin-top:8px;display:none;border-top:1px solid #343d45;padding-top:8px"></div>
  </div>
  <textarea id="json" placeholder='{"format":"designbridge", ...}'></textarea>
  <div class="row">
    <label class="file">Load JSON<input id="file" type="file" accept=".json,.designbridge.json,application/json"></label>
    <button id="import">Import into Penpot</button>
  </div>
  <div class="row">
    <button id="selection" style="background:#343d45">Refresh selection</button>
    <button id="copySelection" style="background:#343d45">Copy snapshot</button>
  </div>
  <div class="row">
    <button id="updateLinked">Update linked shapes from JSON</button>
  </div>
  <div id="selectionStatus" class="muted" style="margin-top:10px">No DesignBridge selection.</div>
  <div id="status"></div>
<script>
const input=document.getElementById("json"), status=document.getElementById("status"), selectionStatus=document.getElementById("selectionStatus");
const apiUrl=document.getElementById("apiUrl"),syncStatus=document.getElementById("syncStatus"),projectIdEl=document.getElementById("projectId"),revisionState=document.getElementById("revisionState");
const updateBadge=document.getElementById("updateBadge"),latestSummary=document.getElementById("latestSummary"),diffSummary=document.getElementById("diffSummary"),selectivePull=document.getElementById("selectivePull"),conflictSummary=document.getElementById("conflictSummary"),documentSummary=document.getElementById("documentSummary"),componentSummary=document.getElementById("componentSummary"),definitionSummary=document.getElementById("definitionSummary"),variantSummary=document.getElementById("variantSummary");
let lastSelection=[],projectId=null,localRevision=null,currentRevision=null,statusTimer=null,lastDiff=null,linkedSnapshotResolver=null,documentSnapshotResolver=null,lastLinkedSnapshots=[],lastVariantReport=null,variantSwitchResolver=null;
try{
  const remembered=localStorage.getItem("designbridge:api-url");
  if(remembered)apiUrl.value=remembered;
}catch(_){}
parent.postMessage({type:"designbridge:get-context"},"*");

function baseUrl(){
  return apiUrl.value.trim().replace(/\/$/,"");
}
async function api(path,options={}){
  const response=await fetch(baseUrl()+path,options);
  const data=await response.json().catch(()=>({}));
  if(!response.ok)throw new Error(typeof data.detail==="string"?data.detail:JSON.stringify(data.detail||data));
  return data;
}

function setRevision(revision){
  localRevision=Number(revision);
  parent.postMessage({type:"designbridge:set-revision",revision:localRevision},"*");
}
async function refreshStatus(){
  if(!projectId)return;
  try{
    const query=localRevision==null?"":"?local_revision="+encodeURIComponent(localRevision);
    const data=await api("/api/penpot/projects/"+encodeURIComponent(projectId)+"/status"+query);
    currentRevision=data.current_revision;
    revisionState.textContent=data.state+" · local "+(data.local_revision??"?")+" / DesignBridge "+data.current_revision;
    updateBadge.style.display=data.state==="behind"?"inline":"none";
    if(data.state==="behind"){
      syncStatus.textContent="DesignBridge has a newer revision. Review or pull latest before pushing Penpot edits.";
      latestSummary.style.display="block";
      latestSummary.textContent="Latest: revision "+data.current_revision+(data.description?" · "+data.description:"");
      reviewDiff().catch(()=>{});
    }else if(data.state==="in_sync"){
      syncStatus.textContent="Penpot and DesignBridge are in sync at revision "+data.current_revision+".";
      latestSummary.style.display="none";
      diffSummary.style.display="none";
      selectivePull.style.display="none";
      conflictSummary.style.display="none";
    }else if(data.state==="ahead"){
      syncStatus.textContent="Penpot revision is ahead of DesignBridge. Pull latest before making further changes.";
      latestSummary.style.display="block";
      latestSummary.textContent="Local revision is ahead of the current DesignBridge revision.";
    }
  }catch(error){
    revisionState.textContent="status unavailable";
  }
}

async function testConnection(){
  try{
    const data=await api("/api/health");
    try{localStorage.setItem("designbridge:api-url",baseUrl())}catch(_){}
    syncStatus.textContent="Connected to DesignBridge "+data.version+".";
    await refreshStatus();
  }catch(error){syncStatus.textContent="Connection failed: "+error.message}
}


function renderDiff(data){
  lastDiff=data;
  const diff=data.diff||{}, summary=diff.summary||{};
  const parts=[
    (summary.added||0)+" added",
    (summary.removed||0)+" removed",
    (summary.changed||0)+" changed",
    (summary.token_sections_changed||0)+" token sections"
  ];
  const rows=[];
  for(const item of diff.changed||[]){
    rows.push("<div><strong>"+item.node_id+"</strong> · "+Object.keys(item.properties||{}).join(", ")+"</div>");
  }
  for(const item of diff.added||[])rows.push("<div>+ <strong>"+item.node_id+"</strong> · added</div>");
  for(const item of diff.removed||[])rows.push("<div>− <strong>"+item.node_id+"</strong> · removed</div>");
  diffSummary.style.display="block";
  diffSummary.innerHTML="<div class='muted' style='margin:0 0 6px'>Changes: "+parts.join(" · ")+"</div>"+(rows.slice(0,20).join("")||"<div>No node-level changes.</div>");
  const selectable=(diff.changed||[]).filter(item=>!(item.properties||{}).scope);
  if(selectable.length){
    selectivePull.style.display="block";
    selectivePull.innerHTML=
      "<div class='muted' style='margin-bottom:6px'>Selective pull</div>"+
      selectable.map(item=>"<label style='display:block;margin:4px 0'><input type='checkbox' class='pullNode' value='"+item.node_id+"'> "+item.node_id+" · "+Object.keys(item.properties||{}).join(", ")+"</label>").join("")+
      "<button id='pullSelected' style='margin-top:8px'>Pull selected changes</button>";
    document.getElementById("pullSelected").onclick=pullSelectedChanges;
  }else{
    selectivePull.style.display="none";
  }
}






function requestVariantSwap(instanceId,targetComponentId,remappedOverrides){
  return new Promise((resolve,reject)=>{
    const requestId="variant-"+Date.now()+"-"+Math.random().toString(16).slice(2);
    variantSwitchResolver={requestId,resolve,reject};
    parent.postMessage({
      type:"designbridge:switch-instance-variant",
      request_id:requestId,
      instance_id:instanceId,
      target_component_id:targetComponentId,
      remapped_overrides:remappedOverrides||{}
    },"*");
    setTimeout(()=>{
      if(variantSwitchResolver&&variantSwitchResolver.requestId===requestId){
        variantSwitchResolver=null;
        reject(new Error("Timed out waiting for Penpot variant switch."));
      }
    },4000);
  });
}
function renderVariantReport(data){
  lastVariantReport=data.variants||{};
  const groups=new Map((lastVariantReport.groups||[]).map(group=>[group.variant_group,group]));
  const rows=[];
  for(const item of lastVariantReport.instances||[]){
    const group=groups.get(item.variant_group);
    const options=(group?.components||[])
      .filter(component=>component.component_id!==item.component_id)
      .map(component=>"<option value='"+component.component_id+"'>"+component.name+" · "+JSON.stringify(component.properties||{})+"</option>")
      .join("");
    rows.push("<div style='margin:7px 0'><strong>"+item.instance_id+"</strong> · "+item.variant_group+" · "+JSON.stringify(item.variant_properties||{})+
      (options?"<br><select class='variantTarget' data-instance='"+item.instance_id+"' style='margin-top:4px;background:#20262b;color:#f4f5f6;border:1px solid #3a444d;border-radius:4px;padding:4px'><option value=''>Choose target…</option>"+options+"</select> <button class='switchVariant' data-instance='"+item.instance_id+"'>Switch</button>":"<br><span class='muted'>No alternate variants.</span>")+"</div>");
  }
  const summary=lastVariantReport.summary||{};
  variantSummary.style.display="block";
  variantSummary.innerHTML="<div class='muted' style='margin:0 0 6px'>Variants: "+(summary.variant_groups||0)+" group(s) · "+(summary.variant_components||0)+" component(s) · "+(summary.variant_instances||0)+" instance(s)</div>"+
    (rows.join("")||"<div>No canonical variant families.</div>");
  for(const button of variantSummary.querySelectorAll(".switchVariant")){
    button.onclick=()=>switchVariant(button.dataset.instance);
  }
}
async function reviewVariants(){
  try{
    if(!projectId)throw new Error("This file is not linked to DesignBridge.");
    const data=await api("/api/penpot/projects/"+encodeURIComponent(projectId)+"/variants");
    renderVariantReport(data);
    syncStatus.textContent="Variant review complete.";
  }catch(error){
    syncStatus.textContent="Variant review failed: "+error.message;
  }
}
async function switchVariant(instanceId){
  try{
    if(localRevision==null)throw new Error("A linked DesignBridge revision is required.");
    const select=[...variantSummary.querySelectorAll(".variantTarget")].find(el=>el.dataset.instance===instanceId);
    const targetComponentId=select?.value;
    if(!targetComponentId)throw new Error("Choose a target variant first.");

    const instance=(lastVariantReport?.instances||[]).find(item=>item.instance_id===instanceId);
    if(!instance)throw new Error("Variant instance is no longer available.");

    const planned=await api(
      "/api/penpot/projects/"+encodeURIComponent(projectId)+"/variant-switch-plan",
      {method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({
        instance_id:instanceId,
        target_component_id:targetComponentId
      })}
    );
    const plan=planned.plan||{};
    if(!plan.compatible){
      const reasons=(plan.issues||[]).map(item=>item.reason).join("; ");
      throw new Error("Variant switch is incompatible: "+reasons);
    }
    if(Number(planned.revision)!==Number(localRevision)){
      throw new Error("DesignBridge changed since this Penpot revision. Reconcile before switching variants.");
    }

    await requestVariantSwap(instanceId,targetComponentId,plan.remapped_overrides||{});

    try{
      const committed=await api(
        "/api/penpot/projects/"+encodeURIComponent(projectId)+"/commit-variant-switch",
        {method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({
          expected_revision:localRevision,
          instance_id:instanceId,
          target_component_id:targetComponentId,
          description:"Switch component instance variant"
        })}
      );
      input.value=JSON.stringify(committed.document,null,2);
      setRevision(committed.revision);
      currentRevision=committed.revision;
      syncStatus.textContent="Switched "+instanceId+" to "+targetComponentId+" in revision "+committed.revision+".";
      await refreshStatus();
      await reviewVariants();
    }catch(commitError){
      try{
        await requestVariantSwap(
          instanceId,
          plan.source_component_id,
          instance.overrides||{}
        );
      }catch(_){}
      throw commitError;
    }
  }catch(error){
    syncStatus.textContent="Variant switch failed: "+error.message;
  }
}

function renderDefinitionReport(data){
  const report=data.report||{}, summary=report.summary||{}, rows=[];
  for(const item of report.components||[]){
    const protectedCount=Object.values(item.protected_instance_overrides||{}).reduce(
      (total,byChild)=>total+Object.values(byChild||{}).reduce((n,props)=>n+(props?.length||0),0),0
    );
    rows.push("<div style='margin:5px 0'><strong>"+item.component_id+"</strong> · "+item.status+
      (Object.keys(item.root_changes||{}).length?"<br><span class='muted'>root: "+Object.keys(item.root_changes).join(", ")+"</span>":"")+
      (Object.keys(item.child_changes||{}).length?"<br><span class='muted'>children changed: "+Object.keys(item.child_changes).join(", ")+"</span>":"")+
      (protectedCount?"<br><span class='muted'>protected instance overrides: "+protectedCount+"</span>":"")+"</div>");
  }
  const changed=report.changed_component_ids||[];
  definitionSummary.style.display="block";
  definitionSummary.innerHTML=
    "<div class='muted' style='margin:0 0 6px'>Definitions: "+(summary.in_sync||0)+" in sync · "+(summary.changed||0)+" changed in Penpot · "+(summary.missing||0)+" missing</div>"+
    (rows.join("")||"<div>No canonical components.</div>")+
    (changed.length?"<div class='row'><button id='captureDefinitions'>Capture Penpot definitions</button><button id='applyDefinitions' style='background:#343d45'>Use DesignBridge definitions</button></div>":"");
  const capture=document.getElementById("captureDefinitions");
  if(capture)capture.onclick=()=>captureComponentDefinitions(changed);
  const apply=document.getElementById("applyDefinitions");
  if(apply)apply.onclick=()=>applyCanonicalDefinitions(changed);
}
async function reviewDefinitions(){
  try{
    if(!projectId||localRevision==null)throw new Error("A linked DesignBridge revision is required.");
    const snapshot=await requestDocumentSnapshot();
    lastLinkedSnapshots=snapshot.snapshots||[];
    const data=await api(
      "/api/penpot/projects/"+encodeURIComponent(projectId)+"/component-definitions",
      {method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({snapshots:lastLinkedSnapshots})}
    );
    renderDefinitionReport(data);
    const s=data.report?.summary||{};
    syncStatus.textContent="Component definition review complete: "+(s.changed||0)+" changed.";
  }catch(error){
    syncStatus.textContent="Definition review failed: "+error.message;
  }
}
async function captureComponentDefinitions(componentIds){
  try{
    if(!projectId||localRevision==null)throw new Error("A linked DesignBridge revision is required.");
    const data=await api(
      "/api/penpot/projects/"+encodeURIComponent(projectId)+"/capture-component-definitions",
      {method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({
        expected_revision:localRevision,
        snapshots:lastLinkedSnapshots,
        component_ids:componentIds,
        description:"Capture Penpot component definition changes"
      })}
    );
    input.value=JSON.stringify(data.document,null,2);
    if(data.changed){
      setRevision(data.revision);
      currentRevision=data.revision;
      syncStatus.textContent="Captured component definitions in revision "+data.revision+".";
    }else{
      syncStatus.textContent="Component definitions already match DesignBridge.";
    }
    await refreshStatus();
    await reviewDefinitions();
  }catch(error){
    syncStatus.textContent="Definition capture failed: "+error.message;
  }
}
async function applyCanonicalDefinitions(componentIds){
  try{
    if(!projectId)throw new Error("This file is not linked to DesignBridge.");
    const latest=await api("/api/penpot/projects/"+encodeURIComponent(projectId)+"/current");
    input.value=JSON.stringify(latest.document,null,2);
    parent.postMessage({
      type:"designbridge:update-component-definitions",
      document:latest.document,
      component_ids:componentIds
    },"*");
    currentRevision=latest.revision;
    if(localRevision===latest.revision){
      setRevision(latest.revision);
      syncStatus.textContent="Applied canonical component definitions at revision "+latest.revision+". Existing Penpot instance overrides remain protected by Penpot.";
    }else{
      syncStatus.textContent="Applied component definitions from revision "+latest.revision+", but other changes remain outstanding. Penpot stays based on revision "+localRevision+".";
    }
    await refreshStatus();
  }catch(error){
    syncStatus.textContent="Definition pull failed: "+error.message;
  }
}

function renderComponentReport(data){
  const report=data.report||{}, summary=report.summary||{}, rows=[];
  for(const item of report.instances||[]){
    rows.push("<div style='margin:5px 0'><strong>"+item.instance_id+"</strong> · "+item.status+" · component "+(item.component_id||"?")+
      (item.overrides_match===false?"<br><span class='muted'>safe overrides differ from canonical</span>":"")+"</div>");
  }
  const capture=(report.overrides_out_of_sync_ids||[]);
  componentSummary.style.display="block";
  componentSummary.innerHTML=
    "<div class='muted' style='margin:0 0 6px'>Components: "+(summary.linked_instances||0)+"/"+(summary.expected_instances||0)+" linked · "+
    (summary.detached_instances||0)+" detached · "+(summary.swapped_instances||0)+" swapped · "+(summary.overrides_out_of_sync||0)+" override set(s) differ</div>"+
    (rows.join("")||"<div>No component instances in the canonical document.</div>")+
    (capture.length?"<button id='captureOverrides' style='margin-top:8px'>Capture safe overrides</button>":"");
  const button=document.getElementById("captureOverrides");
  if(button)button.onclick=()=>captureSafeOverrides(capture);
}
async function reviewComponents(){
  try{
    if(!projectId||localRevision==null)throw new Error("A linked DesignBridge revision is required.");
    const snapshot=await requestDocumentSnapshot();
    lastLinkedSnapshots=snapshot.snapshots||[];
    const data=await api(
      "/api/penpot/projects/"+encodeURIComponent(projectId)+"/component-report",
      {method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({snapshots:lastLinkedSnapshots})}
    );
    renderComponentReport(data);
    const s=data.report?.summary||{};
    syncStatus.textContent="Component review complete: "+(s.linked_instances||0)+"/"+(s.expected_instances||0)+" instances linked.";
  }catch(error){
    syncStatus.textContent="Component review failed: "+error.message;
  }
}
async function captureSafeOverrides(instanceIds){
  try{
    if(!projectId||localRevision==null)throw new Error("A linked DesignBridge revision is required.");
    const data=await api(
      "/api/penpot/projects/"+encodeURIComponent(projectId)+"/capture-instance-overrides",
      {method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({
        expected_revision:localRevision,
        snapshots:lastLinkedSnapshots,
        instance_ids:instanceIds,
        description:"Capture Penpot component instance overrides"
      })}
    );
    input.value=JSON.stringify(data.document,null,2);
    if(data.changed){
      setRevision(data.revision);
      currentRevision=data.revision;
      syncStatus.textContent="Captured safe instance overrides in revision "+data.revision+".";
    }else{
      syncStatus.textContent="Component overrides already match DesignBridge.";
    }
    await refreshStatus();
    await reviewComponents();
  }catch(error){
    syncStatus.textContent="Override capture failed: "+error.message;
  }
}

function requestDocumentSnapshot(){
  return new Promise((resolve,reject)=>{
    documentSnapshotResolver=resolve;
    parent.postMessage({type:"designbridge:get-document-snapshot"},"*");
    setTimeout(()=>{
      if(documentSnapshotResolver){
        documentSnapshotResolver=null;
        reject(new Error("Timed out waiting for Penpot document snapshot."));
      }
    },3000);
  });
}
function renderDocumentReconciliation(data){
  const rec=data.reconciliation||{}, summary=rec.summary||{};
  const rows=(rec.pages||[]).map(page=>
    "<div style='margin:4px 0'><strong>"+page.page_name+"</strong> · "+page.linked+"/"+page.expected+" linked · "+page.coverage_percent+"%"+
    (page.missing?.length?"<br><span class='muted'>missing: "+page.missing.join(", ")+"</span>":"")+"</div>"
  );
  const review=rec.review?.summary||{};
  documentSummary.style.display="block";
  documentSummary.innerHTML=
    "<div class='muted' style='margin:0 0 6px'>Document coverage: "+(summary.linked_nodes||0)+"/"+(summary.expected_nodes||0)+" · "+(summary.coverage_percent||0)+"% · "+(summary.pages_incomplete||0)+" incomplete page(s)</div>"+
    "<div class='muted' style='margin:0 0 6px'>Conflicts: "+(review.conflict_properties||0)+" · local-only: "+(review.local_only_properties||0)+" · remote-only: "+(review.remote_only_properties||0)+"</div>"+
    (rows.join("")||"<div>No canonical pages found.</div>")+
    ((rec.unknown_linked_node_ids||[]).length?"<div class='muted' style='margin-top:6px'>Unknown links: "+rec.unknown_linked_node_ids.join(", ")+"</div>":"")+
    ((rec.duplicate_link_ids||[]).length?"<div class='muted' style='margin-top:6px'>Duplicate links: "+rec.duplicate_link_ids.join(", ")+"</div>":"");
}
async function reviewWholeDocument(){
  try{
    if(!projectId||localRevision==null)throw new Error("A linked DesignBridge revision is required.");
    const snapshot=await requestDocumentSnapshot();
    lastLinkedSnapshots=snapshot.snapshots||[];
    const data=await api(
      "/api/penpot/projects/"+encodeURIComponent(projectId)+"/document-reconciliation",
      {method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({from_revision:localRevision,snapshots:lastLinkedSnapshots})}
    );
    renderDocumentReconciliation(data);
    const s=data.reconciliation?.summary||{};
    syncStatus.textContent="Document review complete: "+(s.coverage_percent||0)+"% linked coverage.";
  }catch(error){
    syncStatus.textContent="Document review failed: "+error.message;
  }
}

function requestLinkedSnapshot(){
  return new Promise((resolve,reject)=>{
    linkedSnapshotResolver=resolve;
    parent.postMessage({type:"designbridge:get-linked-snapshot"},"*");
    setTimeout(()=>{
      if(linkedSnapshotResolver){
        linkedSnapshotResolver=null;
        reject(new Error("Timed out waiting for Penpot linked-shape snapshot."));
      }
    },3000);
  });
}
function renderThreeWay(data){
  const review=data.review||{}, summary=review.summary||{}, rows=[];
  for(const node of review.nodes||[]){
    for(const [property,detail] of Object.entries(node.properties||{})){
      if(!["conflict","local_only","remote_only"].includes(detail.classification))continue;
      rows.push("<div style='margin:6px 0'><strong>"+node.node_id+"."+property+"</strong> · "+detail.classification+
        "<br><span class='muted'>base: "+JSON.stringify(detail.base)+" · Penpot: "+JSON.stringify(detail.local)+" · DesignBridge: "+JSON.stringify(detail.latest)+"</span>"+
        "<br><select class='resolutionChoice' data-node='"+node.node_id+"' data-property='"+property+"' style='margin-top:4px;background:#20262b;color:#f4f5f6;border:1px solid #3a444d;border-radius:4px;padding:4px'>"+
        "<option value=''>Choose resolution…</option><option value='local'>Keep Penpot</option><option value='remote'>Use DesignBridge</option></select></div>");
    }
  }
  conflictSummary.style.display="block";
  conflictSummary.innerHTML=
    "<div class='muted' style='margin:0 0 6px'>Three-way review: "+(summary.conflict_properties||0)+" conflict(s) · "+(summary.local_only_properties||0)+" local-only edit(s)</div>"+
    (rows.slice(0,24).join("")||"<div>No local edits or conflicting properties detected on linked shapes on this page.</div>")+
    (rows.length?"<button id='applyResolutions' style='margin-top:8px'>Apply property resolutions</button>":"");
  const button=document.getElementById("applyResolutions");
  if(button)button.onclick=applyPropertyResolutions;
}
async function checkLocalConflicts(){
  try{
    if(!projectId||localRevision==null)throw new Error("A linked DesignBridge revision is required.");
    const snapshots=await requestLinkedSnapshot();
    lastLinkedSnapshots=snapshots;
    const data=await api(
      "/api/penpot/projects/"+encodeURIComponent(projectId)+"/three-way-review",
      {method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({from_revision:localRevision,snapshots})}
    );
    renderThreeWay(data);
    const conflicts=data.review?.summary?.conflict_properties||0;
    syncStatus.textContent=conflicts
      ? "Review required: "+conflicts+" property conflict(s) would overwrite local Penpot edits."
      : "Three-way review found no conflicting local Penpot edits.";
  }catch(error){
    syncStatus.textContent="Conflict review failed: "+error.message;
  }
}


async function applyPropertyResolutions(){
  try{
    if(!projectId||localRevision==null)throw new Error("A linked DesignBridge revision is required.");
    const controls=[...document.querySelectorAll(".resolutionChoice")];
    if(!controls.length)throw new Error("There are no outstanding properties to resolve.");
    const unresolved=controls.filter(el=>!el.value);
    if(unresolved.length)throw new Error("Choose Keep Penpot or Use DesignBridge for every outstanding property.");
    const resolutions=controls.map(el=>({
      node_id:el.dataset.node,
      property:el.dataset.property,
      choice:el.value
    }));
    const data=await api(
      "/api/penpot/projects/"+encodeURIComponent(projectId)+"/resolve-properties",
      {method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({
        from_revision:localRevision,
        snapshots:lastLinkedSnapshots,
        resolutions,
        description:"Resolve Penpot property conflicts"
      })}
    );
    if(!data.complete)throw new Error("Resolution set is incomplete.");
    if((data.remote_updates||[]).length){
      parent.postMessage({type:"designbridge:apply-property-updates",updates:data.remote_updates},"*");
    }
    input.value=JSON.stringify(data.document,null,2);
    setRevision(data.final_revision);
    currentRevision=data.final_revision;
    syncStatus.textContent="Property resolutions applied. Penpot is synchronized at revision "+data.final_revision+".";
    conflictSummary.style.display="none";
    await refreshStatus();
  }catch(error){
    syncStatus.textContent="Resolution failed: "+error.message;
  }
}

async function pullSelectedChanges(){
  try{
    if(!projectId||localRevision==null)throw new Error("A linked DesignBridge revision is required.");
    const nodeIds=[...document.querySelectorAll(".pullNode:checked")].map(el=>el.value);
    if(!nodeIds.length)throw new Error("Select at least one changed node.");
    const data=await api(
      "/api/penpot/projects/"+encodeURIComponent(projectId)+"/selective-pull",
      {method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({from_revision:localRevision,node_ids:nodeIds})}
    );
    const latest=await api("/api/penpot/projects/"+encodeURIComponent(projectId)+"/current");
    input.value=JSON.stringify(latest.document,null,2);
    parent.postMessage({type:"designbridge:update-linked",document:latest.document,node_ids:data.selected_node_ids},"*");
    if(data.can_advance_revision){
      setRevision(data.to_revision);
      localRevision=data.to_revision;
      syncStatus.textContent="Selected changes fully reconciled revision "+data.to_revision+".";
    }else{
      syncStatus.textContent="Selected changes applied. Other changes remain outstanding, so Penpot stays on revision "+localRevision+".";
    }
    await refreshStatus();
    await reviewDiff();
  }catch(error){
    syncStatus.textContent="Selective pull failed: "+error.message;
  }
}

async function reviewDiff(){
  if(!projectId||localRevision==null)return;
  const data=await api("/api/penpot/projects/"+encodeURIComponent(projectId)+"/diff?from_revision="+encodeURIComponent(localRevision));
  renderDiff(data);
}

async function reviewLatest(){
  try{
    if(!projectId)throw new Error("This Penpot file is not linked to a DesignBridge project yet.");
    const data=await api("/api/penpot/projects/"+encodeURIComponent(projectId)+"/current");
    currentRevision=data.revision;
    latestSummary.style.display="block";
    latestSummary.textContent="Revision "+data.revision+(data.description?" · "+data.description:"")+(data.created_at?" · "+new Date(data.created_at).toLocaleString():"");
    input.value=JSON.stringify(data.document,null,2);
    await reviewDiff();
    syncStatus.textContent="Reviewing revision "+data.revision+". Penpot canvas has not been changed.";
  }catch(error){syncStatus.textContent="Review failed: "+error.message}
}
function startStatusPolling(){
  if(statusTimer)clearInterval(statusTimer);
  statusTimer=setInterval(()=>{ if(projectId)refreshStatus(); },30000);
}

async function pullLatest(){
  try{
    if(!projectId)throw new Error("This Penpot file is not linked to a DesignBridge project yet.");
    syncStatus.textContent="Pulling latest revision…";
    const data=await api("/api/penpot/projects/"+encodeURIComponent(projectId)+"/current");
    input.value=JSON.stringify(data.document,null,2);
    parent.postMessage({type:"designbridge:update-linked",document:data.document},"*");
    setRevision(data.revision);
    currentRevision=data.revision;
    revisionState.textContent="in_sync · local "+data.revision+" / DesignBridge "+data.revision;
    syncStatus.textContent="Pulled revision "+data.revision+".";
  }catch(error){syncStatus.textContent="Pull failed: "+error.message}
}
async function pushSelection(){
  try{
    if(!projectId)throw new Error("This Penpot file is not linked to a DesignBridge project yet.");
    const linked=lastSelection.filter(item=>item.designbridge_id);
    if(!linked.length)throw new Error("Select at least one DesignBridge-linked shape.");
    syncStatus.textContent="Comparing and saving Penpot changes…";
    const data=await api(
      "/api/penpot/projects/"+encodeURIComponent(projectId)+"/selection",
      {method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({selection:linked,description:"Penpot direct sync",expected_revision:localRevision})}
    );
    input.value=JSON.stringify(data.document,null,2);
    setRevision(data.revision);
    currentRevision=data.revision;
    revisionState.textContent="in_sync · local "+data.revision+" / DesignBridge "+data.revision;
    syncStatus.textContent="Saved revision "+data.revision+" with "+data.changes.length+" change(s).";
  }catch(error){
    const text=String(error.message||error);
    syncStatus.textContent=text.includes("revision_conflict")
      ? "Push blocked: DesignBridge changed since your last pull. Pull latest, review, then push again."
      : "Push failed: "+text;
    await refreshStatus();
  }
}
document.getElementById("connect").addEventListener("click",testConnection);
document.getElementById("reviewLatest").addEventListener("click",reviewLatest);
document.getElementById("checkConflicts").addEventListener("click",checkLocalConflicts);
document.getElementById("reviewDocument").addEventListener("click",reviewWholeDocument);
document.getElementById("reviewComponents").addEventListener("click",reviewComponents);
document.getElementById("reviewDefinitions").addEventListener("click",reviewDefinitions);
document.getElementById("reviewVariants").addEventListener("click",reviewVariants);
document.getElementById("pullLatest").addEventListener("click",pullLatest);
document.getElementById("pushSelection").addEventListener("click",pushSelection);

document.getElementById("file").addEventListener("change",async e=>{
  const file=e.target.files?.[0]; if(file) input.value=await file.text();
});
document.getElementById("import").addEventListener("click",()=>{
  try{
    const document=JSON.parse(input.value);
    status.textContent="Importing…";
    parent.postMessage({type:"designbridge:import",document},"*");
  }catch(error){status.textContent="Invalid JSON: "+error.message}
});
document.getElementById("selection").addEventListener("click",()=>{
  parent.postMessage({type:"designbridge:get-selection"},"*");
});
document.getElementById("copySelection").addEventListener("click",async()=>{
  try{
    await navigator.clipboard.writeText(JSON.stringify(lastSelection,null,2));
    status.textContent="Selection snapshot copied.";
  }catch(error){
    status.textContent="Copy failed: "+error.message;
  }
});
document.getElementById("updateLinked").addEventListener("click",()=>{
  try{
    const document=JSON.parse(input.value);
    status.textContent="Updating linked shapes…";
    parent.postMessage({type:"designbridge:update-linked",document},"*");
  }catch(error){
    status.textContent="Invalid JSON: "+error.message;
  }
});
window.addEventListener("message",event=>{
  const message=event.data;
  if(message?.type==="designbridge:context"){
    projectId=message.project_id||null;
    localRevision=message.revision==null?null:Number(message.revision);
    projectIdEl.textContent=projectId||"not linked";
    if(projectId){
      revisionState.textContent="local "+(localRevision??"?");
      refreshStatus();
      startStatusPolling();
    }else{
      revisionState.textContent="not linked";
    }
    return;
  }
  if(message?.type==="designbridge:document-snapshot"){
    if(documentSnapshotResolver){
      const resolve=documentSnapshotResolver;
      documentSnapshotResolver=null;
      resolve({snapshots:message.snapshots||[],pages:message.pages||[]});
    }
    return;
  }
  if(message?.type==="designbridge:linked-snapshot"){
    if(linkedSnapshotResolver){
      const resolve=linkedSnapshotResolver;
      linkedSnapshotResolver=null;
      resolve(message.snapshots||[]);
    }
    return;
  }
  if(message?.type==="designbridge:selection"){
    lastSelection=message.selection||[];
    const linked=lastSelection.filter(item=>item.designbridge_id);
    selectionStatus.textContent=linked.length
      ? "Selected: "+linked.map(item=>item.name+" ["+item.designbridge_id+"]").join(", ")
      : "Selection has no DesignBridge-linked shapes.";
    return;
  }
  if(message?.type==="designbridge:variant-switch-result"){
    if(variantSwitchResolver&&variantSwitchResolver.requestId===message.request_id){
      const pending=variantSwitchResolver;
      variantSwitchResolver=null;
      if(message.ok)pending.resolve(message.result);
      else pending.reject(new Error(message.error||"Penpot variant switch failed."));
    }
    return;
  }
  if(message?.type==="designbridge:component-definition-update-result"){
    status.textContent=message.ok
      ? "Updated "+message.result.updated+" component main shape(s)."
      : "Component definition update failed: "+message.error;
    return;
  }
  if(message?.type==="designbridge:update-linked-result"){
    status.textContent=message.ok
      ? "Updated "+message.result.updated+" linked shape(s); "+message.result.missing+" missing from JSON."
      : "Update failed: "+message.error;
    return;
  }
  if(message?.type!=="designbridge:import-result")return;
  status.textContent=message.ok
    ? "Imported "+message.result.pages+" page(s): "+message.result.name
    : "Import failed: "+message.error;
});
</script>
